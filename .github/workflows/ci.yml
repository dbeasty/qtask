name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The KDB tests spawn kdb-service and helper processes; if one ever wedges, fail in
    # minutes rather than at GitHub's 6-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's node:24-alpine — the actual production
          # runtime — so CI catches version-specific incompatibilities
          # before they reach a deploy instead of only being caught locally.
          node-version: 24
          cache: npm

      - name: Install API dependencies
        run: npm ci

      # The KDB tests run against the released kdb-service that @limidus/kdb-client is pinned to;
      # without it they skip, and CI would say nothing about the KDB backend.
      - name: Fetch the pinned kdb-service release
        run: npm run kdb:fetch

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Before the tests: several of them import client/src components (TaskLaborEditor,
      # TaskMaterialsEditor, TaskStepsEditor), which resolve react from client/node_modules.
      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Run tests
        run: npm test

      - name: Run shared package tests
        run: npm run test:shared

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Build API
        run: npm run build

      - name: Build client
        run: npm run build --prefix client

      - name: Install admin-client dependencies
        run: npm ci --prefix admin-client

      - name: Build admin-client
        run: npm run build --prefix admin-client

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Typecheck mobile
        run: npm run typecheck --prefix mobile

      - name: Run mobile tests
        run: npm test --prefix mobile
