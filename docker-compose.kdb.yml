# KDB (kdb-service v0.8.0) alongside the default MongoDB stack. Opt-in: the default deployment
# (docker-compose.yml, docker-compose.prod.yml) is unchanged unless this file is added.
#
#   docker compose -f docker-compose.yml -f docker-compose.kdb.yml up -d kdb
#   docker compose -f docker-compose.yml -f docker-compose.kdb.yml [-f docker-compose.prod.yml] --profile app up -d
#
# What the app does with KDB is decided by the stage flags in .env (docs/KDB_MIGRATION.md, section 4);
# all default to off here, so adding this file alone only starts kdb-service and tells the app
# where it is. Stage 2: DATA_SHADOW_WRITES=true. Stage 3: + DATA_SHADOW_READS=true, DATA_KDB_PUSHDOWN=true.
# Stage 4: DATA_KDB=true with DATA_SHADOW_WRITES=true.
#
# kdb-service has no usable credential setup in v0.8.0 (without --rbac it checks none; with it,
# users exist only if created through the Go API), so it is reachable only on `qtask_kdb`, an
# internal network with no published ports and only the app containers attached. Admin (9093)
# and control plane (9094) listen on the container's loopback only; deploy/kdb-backup.sh reaches
# the control plane through `docker compose exec` (KDB_COMPOSE).
#
# The release publishes the image for linux/amd64 only. On an arm64 host it runs under emulation
# (KDB_PLATFORM); for production on arm64 use the systemd unit (deploy/qtask-kdb.service), which
# installs the native linux-arm64 binary from the same release.

services:
  # The image runs kdb-service as uid 10001 and has no /var/backups/kdb, so Docker creates that
  # mount point root-owned and every backup fails with 503. This one-shot hands it to uid 10001
  # (the same for a bind mount), using the kdb image itself as root.
  kdb-backup-dir:
    image: ghcr.io/dbeasty/kdb/kdb-service:v0.9.1
    platform: ${KDB_PLATFORM:-linux/amd64}
    user: "0:0"
    entrypoint: ["chown", "10001:10001", "/var/backups/kdb"]
    volumes:
      - qtask_kdb_backups:/var/backups/kdb
    network_mode: none
    restart: "no"

  kdb:
    image: ghcr.io/dbeasty/kdb/kdb-service:v0.9.1
    platform: ${KDB_PLATFORM:-linux/amd64}
    depends_on:
      kdb-backup-dir:
        condition: service_completed_successfully
    # Exit 75 is kdb-service's orderly stop under sustained memory pressure; it relies on a restart.
    restart: unless-stopped
    command:
      - --data-dir=/var/lib/kdb
      - --namespace=${KDB_NAMESPACE_PREFIX:-qtask/docs}
      - --sql-addr=tcp://0.0.0.0:9090?bind=true
      - --peer-addr=
      - --stream-addr=
      - --admin-addr=127.0.0.1:9093
      - --control-addr=127.0.0.1:9094
      - --control-write
      - --control-ui=false
      - --control-backup-dir=/var/backups/kdb
      - --expire-field=_expireAt
      - --expire-interval=1m
      - --durability=sync
      - --memory-budget-mb=${KDB_MEMORY_BUDGET_MB:-1536}
      - --scrub-interval=24h
      - --log-format=json
    # The budget above is what kdb-service admits work against; in the 100,000-task rehearsal
    # collection-wide reads went past a 4 GiB limit regardless (docs/KDB_MIGRATION.md, B5); the kernel
    # would kill it at this one. restart: unless-stopped brings it back (a 3 min reopen at that size).
    mem_limit: ${KDB_MEM_LIMIT:-2g}
    stop_grace_period: 45s
    volumes:
      - qtask_kdb_data:/var/lib/kdb
      - qtask_kdb_backups:/var/backups/kdb
    networks:
      - qtask_kdb
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/readyz"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3

  api:
    environment: &kdb-env
      KDB_ADDR: tcp://kdb:9090
      KDB_NAMESPACE_PREFIX: ${KDB_NAMESPACE_PREFIX:-qtask/docs}
      DATA_KDB: ${DATA_KDB:-false}
      DATA_SHADOW_WRITES: ${DATA_SHADOW_WRITES:-false}
      DATA_SHADOW_READS: ${DATA_SHADOW_READS:-false}
      DATA_SHADOW_READ_SAMPLE: ${DATA_SHADOW_READ_SAMPLE:-1}
      DATA_KDB_PUSHDOWN: ${DATA_KDB_PUSHDOWN:-false}
    depends_on:
      kdb:
        condition: service_healthy
    networks:
      - qtask
      - qtask_kdb

  admin:
    environment: *kdb-env
    depends_on:
      kdb:
        condition: service_healthy
    networks:
      - qtask
      - qtask_kdb

networks:
  qtask_kdb:
    internal: true

volumes:
  qtask_kdb_data:
  qtask_kdb_backups:
